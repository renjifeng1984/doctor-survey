<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>医瞳境元 · 调研模块原型</title>
<!--
  原型：调研模块。首页 1:1 复刻 feature-3.0.1 的 pages/home/index.vue：
  顶栏/门户/头像六边形/会话卡/入口卡/悬浮卡/底栏的尺寸与素材都取自源码（assets 已拷入 ./assets）。
  新增的是「待办胶囊」与「我的调研」入口。
-->
<style>
:root{
  --app-page-bg:#f4f4fa; --app-surface:#fff;
  --app-text-primary:#14123f; --app-text-secondary:#605f72; --app-text-tertiary:#8e8fa8;
  --app-border-soft:#e6e5eb;
  --app-accent:#2a1ba8; --app-accent-active:#201584;
  --app-warning:#a85500; --app-success:#23794a; --app-danger:#d9363e;
  --chat-ink:#14123f; --chat-body:#2f3248; --chat-accent:#2a1ba8;
  --chat-brand-from:#056fe3; --chat-brand-to:#0530e3; --chat-headline:#101561;
  --app-edge:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e9e9f0;
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;padding:24px;color:var(--chat-ink)}
.phone{width:390px;height:844px;background:var(--app-page-bg);border-radius:44px;overflow:hidden;position:relative;
  box-shadow:0 24px 60px rgba(20,18,63,.22),0 0 0 10px #1b1b22}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}

/* ══════════ 首页（.chat-home） ══════════ */
.home{
  background-color:var(--app-page-bg);
  background-image:linear-gradient(180deg,#c9c7f9 0,#d5d8f9 60px,#e0e0fa 120px,#e9e8fa 185px,#e8e9fb 245px,#eef0fc 480px);
  height:100%;
}
/* 顶栏：padding-top 43 为 iPhone12/13 的脚本算值，左内边距归零，横距交给 --app-edge */
.topbar{display:flex;align-items:center;flex-shrink:0;padding:43px 20px 0 0;min-height:42px;box-sizing:content-box}
.logo{flex:0 0 auto;width:28px;height:17px;margin-left:var(--app-edge);position:relative;top:2px;display:block}
.title{margin-left:3px;font-size:21px;font-weight:700;line-height:1;letter-spacing:.01em;color:var(--chat-ink);position:relative;top:2px}
.capsule{margin-left:auto;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.8);border-radius:20px;
  padding:5px 11px;font-size:13px;color:#4a4560}
.body{flex:1;height:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column}
.body::-webkit-scrollbar{display:none}

/* 弹窗（对比方案） */
.mask{position:absolute;inset:0;background:rgba(20,18,63,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:0 40px}
.dialog{width:100%;background:#fff;border-radius:20px;padding:26px 24px 18px;text-align:center;
  box-shadow:0 20px 48px rgba(20,18,63,.28);position:relative}
.dialog .ttl{font-size:17px;font-weight:700;color:var(--app-text-primary);line-height:1.4}
.dialog .desc{margin-top:10px;font-size:14px;line-height:1.6;color:var(--app-text-secondary)}
.dialog .big{margin-top:16px;font-size:13px;color:var(--app-accent);font-weight:600}
.dialog .btn{margin-top:20px}
.dialog .later{margin-top:14px;font-size:14px;color:var(--app-text-tertiary);cursor:pointer}
.dialog .close{position:absolute;right:12px;top:12px;width:26px;height:26px;border-radius:50%;background:#f2f1f7;
  color:#8e8fa8;font-size:14px;display:flex;align-items:center;justify-content:center}
/* 微信胶囊（系统 UI，盖在页面上；真实值：87×32、top 48、右边距 7） */
.wx-capsule{position:absolute;top:48px;right:7px;width:87px;height:32px;border-radius:16px;z-index:30;
  display:flex;align-items:center;box-sizing:border-box;
  background:rgba(255,255,255,.82);border:.5px solid rgba(0,0,0,.08);
  box-shadow:0 1px 4px rgba(0,0,0,.04);backdrop-filter:blur(12px)}
.wx-capsule .half{flex:1;height:100%;display:flex;align-items:center;justify-content:center}
.wx-capsule .divider{width:.5px;height:18px;background:rgba(0,0,0,.12)}
/* 门户：高度 126，底部对齐，栈下沿压进会话卡 45px */
.portal{display:flex;align-items:flex-end;justify-content:center;flex-shrink:0;height:148px}
.stack{position:relative;width:110px;height:110px;margin-bottom:-45px}
.glow{position:absolute;left:50%;top:50%;width:188px;height:175px;transform:translate(-50%,-50%);pointer-events:none;
  background-image:radial-gradient(closest-side,rgba(255,255,255,.5),rgba(255,255,255,0))}
.hex{position:absolute;inset:0;width:110px;height:110px;pointer-events:none}
.avatar{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
  overflow:hidden;background-color:var(--app-surface);
  clip-path:path('M46.34 11 Q55 6 63.66 11 L93.94 25.5 Q102.6 30.5 102.6 40.5 L102.6 69.5 Q102.6 79.5 93.94 84.5 L63.66 99 Q55 104 46.34 99 L16.06 84.5 Q7.4 79.5 7.4 69.5 L7.4 40.5 Q7.4 30.5 16.06 25.5 Z')}
.avatar img{width:100%;height:100%;object-fit:cover;transform:scale(1.156) translate(-2.5%,18.1%)}

/* 会话卡 */
.session{border-radius:26px 26px 0 0;padding:26px 25px 16px;flex:1 0 auto;
  background-image:linear-gradient(180deg,#e3e6fb 0%,#edf0fc 55%);
  box-shadow:inset 0 1px 0 #fff,inset 0 2px 0 rgba(255,255,255,.5),0 -3px 14px rgba(255,255,255,.7)}
.hi{display:block;width:43.4px;height:30px;margin-top:4px;margin-bottom:12px}
.copy{margin:1px 0 0;font-size:16px;line-height:1.5;color:var(--chat-body)}
.headline{font-size:21px;font-weight:700;line-height:1.25;color:var(--chat-headline)}\n.paragraph{font-size:16px;line-height:1.5;letter-spacing:0;color:var(--chat-body)}

/* 入口卡 */
.entry{display:flex;align-items:center;gap:12px;margin-top:12px;padding:14px;border:1px solid rgba(42,27,168,.14);
  border-radius:16px;background-image:linear-gradient(180deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.5) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 16px rgba(20,18,63,.07);cursor:pointer;transition:opacity .12s}
.entry.first{margin-top:22px}
.entry:active{opacity:.6}
.entry .ic{width:44px;height:44px;flex:none;display:block}
.entry .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.entry .t{font-size:16px;font-weight:600;line-height:22px;color:var(--chat-ink)}
.entry .d{margin-top:2px;font-size:13px;line-height:1.45;color:var(--chat-body);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entry .go{flex:0 0 auto;width:20px;height:20px;display:block}

/* 悬浮卡（.chat-home__fab） */
.fab{position:absolute;right:16px;bottom:64px;width:84px;padding:9px 6px 18px;border-radius:18px;overflow:hidden;
  border:1px solid rgba(255,255,255,.22);display:flex;flex-direction:column;align-items:center;
  background-color:var(--chat-accent);
  background-image:linear-gradient(120deg,#6a5fe8 0%,#3a2fbe 42%,#2a1ba8 68%,#4f45d8 100%);
  box-shadow:0 10px 22px rgba(42,27,168,.3),0 0 0 3px rgba(240,212,154,.16)}
.fab .badge{padding:2px 8px;border-radius:999px;background:#f0d49a;color:var(--chat-accent);font-size:11px;font-weight:700;line-height:15px;letter-spacing:.5px}
.fab .tt{margin-top:4px;font-size:19px;font-weight:700;line-height:21px;color:#fff;letter-spacing:.5px}
.fab .ar{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:16px;font-weight:700;line-height:14px;color:#f0d49a}

/* 底栏（AppTabBar） */
.tabbar{flex-shrink:0;display:flex;height:50px;padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:content-box;
  background:var(--app-surface);border-top:1px solid var(--app-border-soft)}
.tabbar .item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tabbar .ib{display:flex;align-items:center;justify-content:center;height:25px}
.tabbar .ib img{display:block}
.tabbar .item span{margin-top:2px;font-size:10px;line-height:1;color:var(--app-text-secondary)}
.tabbar .item.on span{color:var(--app-accent)}

.nav .close-btn{margin-left:auto;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--app-text-secondary);
  box-shadow:0 2px 8px rgba(20,18,63,.08);cursor:pointer}
.from-cc{margin:0 4px 12px;padding:9px 12px;border-radius:10px;background:rgba(42,27,168,.07);
  font-size:12.5px;color:var(--app-accent);font-weight:600}
.method-icon {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    /* 三支都是单色字形，颜色统一交给这里（`--accent` = 品牌靛蓝） */
    background-color: var(--accent);
}

.appicon{width:42px;height:42px;flex:none;display:block;border-radius:10px;box-shadow:0 1px 3px rgba(20,18,63,.08)}
.appicon img{width:100%;height:100%;display:block;border-radius:10px}
.appicon.off{opacity:.45}
/* 舞台：手机 / 桌面两种外壳 */
.canvas{position:relative;display:inline-block}#stage{position:relative}
#stage.is-phone{width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--app-page-bg);
  box-shadow:0 24px 60px rgba(20,18,63,.22),0 0 0 10px #1b1b22}
#stage.is-desktop{width:1180px;height:760px;border-radius:12px;overflow:hidden;background:#fff;
  box-shadow:0 30px 70px rgba(20,18,63,.28),0 0 0 1px rgba(20,18,63,.08)}

/* 同屏对照：桌面端 + 手机端 */
#stage.is-both{width:1660px;height:920px;border-radius:12px;background:#EDEEF4;padding:30px 34px;box-sizing:border-box;
  box-shadow:0 24px 60px rgba(20,18,63,.18)}
.both{display:flex;gap:34px;align-items:flex-start}
.pane{display:flex;flex-direction:column}
.pane .cap{margin-top:14px;font-size:13px;color:#5C5876}
.pane.phone .cap{margin-top:30px}
.frame{position:relative;overflow:hidden;background:#fff}
.pane.desk .frame{width:1180px;height:760px;border-radius:12px;box-shadow:0 14px 40px rgba(20,18,63,.18)}
.pane.phone .frame{width:390px;height:844px;border-radius:44px;box-shadow:0 0 0 10px #1b1b22,0 14px 40px rgba(20,18,63,.2)}
.dt{display:flex;flex-direction:column;height:100%;background:#fff;font-size:13px;color:#191919}
.dt-title{height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#F7F7F7;border-bottom:1px solid #E6E6E6;flex:none}
.dt-title .dots{display:flex;gap:6px}
.dt-title .dots i{width:11px;height:11px;border-radius:50%;background:#D8D8D8;display:block}
.dt-title .nm{font-size:12.5px;color:#6B6B6B}
.dt-body{flex:1;display:flex;min-height:0}
.dt-rail{width:60px;flex:none;background:#EDEDED;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:16px}
.dt-rail .av{width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,#4B3BD6,#7A6BEA);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.dt-rail .ic{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#6B6B6B}
.dt-rail .ic.on{background:rgba(42,27,168,.1);color:#2a1ba8}
.dt-list{width:250px;flex:none;background:#F7F7F7;border-right:1px solid #E6E6E6;display:flex;flex-direction:column}
.dt-search{margin:10px;height:30px;border-radius:6px;background:#fff;display:flex;align-items:center;padding:0 10px;color:#9A9A9A;font-size:12px}
.dt-item{display:flex;gap:10px;padding:10px 12px;align-items:center;cursor:pointer}
.dt-item.on{background:#E4E0F7}
.dt-item .av{width:36px;height:36px;border-radius:6px;background:#DDE1FF;color:#3a2fbe;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;flex:none}
.dt-item .nm{font-size:13.5px;font-weight:600}
.dt-item .sub{margin-top:3px;font-size:11.5px;color:#8e8fa8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt-chat{flex:1;display:flex;flex-direction:column;min-width:0;background:#F5F5F5}
.dt-chat-head{height:52px;background:#F5F5F5;border-bottom:1px solid #E6E6E6;display:flex;align-items:center;gap:8px;padding:0 18px;flex:none}
.dt-chat-head .nm{font-size:15px;font-weight:600}
.dt-chat-head .meta{font-size:12px;color:#8e8fa8}
.dt-chat-head .tag{font-size:10px;color:#07C160;border:1px solid #07C160;border-radius:3px;padding:1px 4px}
.dt-msgs{flex:1;overflow-y:auto;padding:16px 18px}
.dt-input{flex:none;border-top:1px solid #E6E6E6;background:#fff;padding:10px 14px 14px}
.dt-input .tools{display:flex;gap:14px;color:#6B6B6B;font-size:15px;margin-bottom:8px}
.dt-input .box{height:76px;border-radius:6px;background:#FAFAFA;border:1px solid #EDEDED}
.dt-input .send-row{display:flex;justify-content:flex-end;margin-top:8px}
.dt-side{width:300px;flex:none;border-left:1px solid #E6E6E6;background:#fff;display:flex;flex-direction:column}
.dt-side .hd{padding:14px 16px 6px;font-size:14px;font-weight:700}
.dt-side .sb{font-size:11.5px;color:#8e8fa8;padding:0 16px 10px}
.dt-side .list{padding:0 16px 16px;overflow-y:auto}
/* ── 登录页：逐条对齐 pages/login/login.vue ── */
.login-page{--accent:#2a1ba8;--text-primary:#14123f;--text-secondary:#605f72;--border-soft:#e6e5eb;
  --shell-width:336px;--logo-size:68px;--title-size:26px;--subtitle-size:13px;--button-height:48px;
  --button-radius:20px;--button-font-size:16px;--control-width:300px;--brand-form-gap:60px;
  position:relative;display:flex;flex-direction:column;height:100%;background:#fff;overflow:hidden;z-index:0}
.login-head-bg{position:absolute;left:0;top:0;width:100%;height:260px;object-fit:cover;z-index:-2}
.login-back{position:absolute;left:16px;top:52px;z-index:20;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.72);box-shadow:0 2px 8px rgba(20,18,63,.08);display:flex;align-items:center;
  justify-content:center;cursor:pointer}
.login-back svg{width:18px;height:18px;display:block}
.login-shell{position:relative;flex:1;min-height:100%;display:flex;flex-direction:column;align-items:center;
  padding:28px 18px;box-sizing:border-box;z-index:1}
.login-centerpiece{width:min(100%,var(--shell-width));margin:auto 0;display:flex;flex-direction:column;align-items:center}
.brand-stage{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.brand-mark{display:flex;align-items:center;justify-content:center}
.brand-logo{width:var(--logo-size);height:var(--logo-size);display:block}
.brand-title{margin-top:16px;font-size:var(--title-size);line-height:1.15;font-weight:700;letter-spacing:.01em;color:var(--text-primary)}
.brand-subtitle{margin-top:10px;max-width:240px;font-size:var(--subtitle-size);line-height:1.5;font-weight:500;
  color:var(--text-secondary);text-align:center}
.action-panel{width:100%;display:flex;flex-direction:column;align-items:center;margin-top:var(--brand-form-gap)}
.primary-action{width:100%;min-height:var(--button-height);display:flex;align-items:center;justify-content:center;
  border:0;border-radius:var(--button-radius);background:var(--accent);font-size:var(--button-font-size);
  font-weight:500;color:#fff;cursor:pointer;font-family:inherit}
.primary-action:active{background:#201584}
.protocol-box{width:min(100%,var(--control-width));margin-top:18px;padding:0 2px;box-sizing:border-box}
.protocol-copy{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;min-height:44px}
.protocol-check{width:16px;height:16px;flex:0 0 16px;display:flex;align-items:center;justify-content:center}
.protocol-check-box{display:flex;align-items:center;justify-content:center;width:16px;height:16px;
  border:1px solid rgba(0,0,0,.25);border-radius:2.5px;background:#fff;box-sizing:border-box}
.protocol-check-box.on{background:var(--accent);border-color:var(--accent);color:#fff;font-size:10px}
.protocol-text{display:flex;flex-wrap:wrap;align-items:center;font-size:12px;line-height:18px;font-weight:500;color:var(--text-secondary)}
.protocol-link{font-size:12px;line-height:18px;font-weight:500;color:var(--accent);white-space:nowrap;cursor:pointer;text-decoration:none}
.other-login{width:min(100%,var(--control-width));margin-top:24px;box-sizing:border-box}
.other-login-divider{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.other-login-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.08),rgba(0,0,0,0))}
.other-login-label{flex:0 0 auto;font-size:12px;line-height:1;font-weight:500;color:var(--text-secondary)}
.other-login-actions{display:flex;gap:10px}
.secondary-action{width:auto;flex:1;min-height:var(--button-height);display:flex;align-items:center;
  justify-content:center;gap:6px;border:0;border-radius:var(--button-radius);background:rgba(42,27,168,.08);
  font-size:var(--button-font-size);font-weight:500;color:var(--accent);cursor:pointer;font-family:inherit}
.secondary-action:active{background:rgba(42,27,168,.16)}
.method-icon{flex:0 0 auto;width:18px;height:18px;background-color:var(--accent)}

.wc{background:#EDEDED}
.wc-nav{display:flex;align-items:center;padding:50px 96px 10px 16px;background:#EDEDED;border-bottom:1px solid #DCDCDC}
.wc-nav .t{flex:1;text-align:center;font-size:16px;font-weight:600;color:#191919}
.wc-nav .b{width:26px;display:flex;align-items:center}.wc-nav .b svg{width:18px;height:18px;display:block}
.wc-nav .m{width:26px;text-align:right;font-size:17px;color:#191919}
.wc-time{margin:14px 0 4px;text-align:center;font-size:11.5px;color:#9A9A9A}
.wc-body{flex:1;overflow-y:auto;padding-bottom:8px}
.msg{display:flex;gap:9px;padding:8px 14px}
.msg .av{width:38px;height:38px;border-radius:5px;flex:none;background:linear-gradient(135deg,#dfe3ff,#c9c2f5);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#3a2fbe;font-weight:700}
.bubble{background:#fff;border-radius:6px;padding:10px 12px;font-size:15px;line-height:1.55;color:#191919;max-width:252px}
.card-mini{width:248px;flex:none;background:#fff;border-radius:8px;overflow:hidden}
.card-mini .head{display:flex;gap:10px;padding:12px 12px 10px;align-items:flex-start}
.card-mini .ic{width:40px;height:40px;border-radius:6px;flex:none;background:linear-gradient(135deg,#4B3BD6,#7A6BEA);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.card-mini .tt{font-size:14.5px;font-weight:600;color:#191919;line-height:1.35}
.card-mini .ds{margin-top:4px;font-size:12px;color:#9A9A9A;line-height:1.4;overflow-wrap:anywhere}
.card-mini .src{border-top:1px solid #EFEFEF;padding:7px 12px;font-size:11px;color:#B2B2B2;display:flex;align-items:center;gap:5px}
.lnk{color:#576B95;text-decoration:none;word-break:break-all}
.wc-input{display:flex;align-items:center;gap:10px;padding:8px 12px 22px;background:#F7F7F7;border-top:1px solid #DCDCDC}

function go(s){ state.screen = s; render(); }
function openDetail(){ state.screen = 'detail'; state.step = 0; render(); }
function closeModal(){ state.modal = false; render(); }
function openSheet(){ state.ccSheet = true; render(); }
function sendCard(title){ state.ccTitle = title; state.ccSent = true; state.ccSheet = false; render(); }
function gotoQ(n){ if(n>=0 && n<QS.length){ state.step = n; render(); } }
function prevQ(){ if (state.step > 0) { state.step--; render(); } }
function nextQ(){ if (state.step < QS.length - 1) { state.step++; render(); } else { state.submitted = true; state.modal = false; state.step = 0; go('list'); } }
function sendCardD(t){ state.ccTitle = t; render(); }
function render(){
  if (!SCREENS[state.screen]) state.screen = 'both';
  const stage = document.getElementById('stage');
  const isDesktop = state.screen === 'ccDesktop' || state.screen === 'both';
  stage.className = state.screen === 'both' ? 'is-both' : (isDesktop ? 'is-desktop' : 'is-phone');
  const cap = document.querySelector('.wx-capsule');
  if (cap) cap.style.display = isDesktop ? 'none' : 'flex';
  stage.innerHTML = (SCREENS[state.screen] || SCREENS.both)();
}
render();
</script>
</body>
</html>
